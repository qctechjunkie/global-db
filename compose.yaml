networks:
  wp-network:
    external: true
services:
  global-mariadb:
    image: mariadb:latest
    container_name: ${MARIADB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: ${MYSQL_INITDB_SKIP_TZINFO}
    volumes:
      - ${DOCKER_DATA_PATH}/mariadb:/var/lib/mysql
    ports:
      - "${MARIADB_PORT}:3306"
    networks:
      - wp-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE}
      --max-connections=${MAX_CONNECTIONS}
      --default-authentication-plugin=mysql_native_password
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PHPMYADMIN_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - global-mariadb
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: ${MEMORY_LIMIT}
      MAX_EXECUTION_TIME: ${MAX_EXECUTION_TIME}
      PMA_CONTROLUSER: ${PMA_CONTROLUSER}
      PMA_CONTROLPASS: ${PMA_CONTROLPASS}
      PMA_PMADB: ${PMA_PMADB}
      PMA_CONTROLHOST: ${PMA_CONTROLHOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks:
      - wp-network
  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: ${BACKUP_CONTAINER_NAME:-db-backup}
    restart: unless-stopped
    depends_on:
      - global-mariadb
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-global-mariadb}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ${DOCKER_DATA_PATH}/backups:/backups
    networks:
      - wp-network
